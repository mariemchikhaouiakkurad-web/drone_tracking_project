# DALBD/run/run.conf - the ONLY file to edit. Read by every script (laptop and Jetson).
JETSON_IP=192.168.10.1
LAPTOP_IP=192.168.10.2
CONTAINER=isaac_ros_dev-aarch64-container
CONTAINER_USER=admin

# vision
DETECTOR_EVERY=10            # YOLO check every N tracker images
CAM_PORT=9300                # laptop camera stream
CAM_DEVICE=auto              # auto = find the 640x512 camera, or e.g. 4 for /dev/video4
CAM_MODE=mjpg                # mjpg | raw  (raw = --raw --skip-dup 0.5)
STREAM_TOOLS=1               # 1 = also start latency_trace + tracker image stream (port 9400)

# sound
AUDIO_PORT=5005
UMA8_CARD=SPK
SOUND_DOMAIN=42
VISION_DOMAIN=0
SOUND_WHERE=container        # container | host   (where start.sh / warning.sh run)
